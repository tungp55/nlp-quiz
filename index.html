<style>
:root{
  --bg:#f6f5f1; --card:#ffffff; --ink:#1d1d1b; --muted:#6b6a64; --line:#e4e2da;
  --accent:#2f5d50; --accent-soft:#e3eee9; --ok:#1f7a4d; --ok-soft:#e1f3e9; --bad:#b3372f; --bad-soft:#fbe7e5;
  --hard:#8a5a00; --hard-soft:#fbf0d9; --x:#4b3fa0; --x-soft:#ebe8fa; --shadow:0 1px 2px rgba(0,0,0,.04),0 6px 24px rgba(0,0,0,.05);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#161614; --card:#201f1d; --ink:#ecebe6; --muted:#a3a19a; --line:#34332f;
  --accent:#7fc4ab; --accent-soft:#22332d; --ok:#6fd19c; --ok-soft:#1d3327; --bad:#f08a80; --bad-soft:#3a2321;
  --hard:#f0c060; --hard-soft:#3a3020; --x:#b3a9f5; --x-soft:#2a2645; --shadow:none;}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Be Vietnam Pro",system-ui,sans-serif;font-size:16px;line-height:1.55}
.wrap{max-width:860px;margin:0 auto;padding:24px 18px 80px}
header h1{font-size:24px;margin:0 0 4px;letter-spacing:-.01em}
header p{margin:0;color:var(--muted);font-size:14px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:16px;box-shadow:var(--shadow)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row+.row{margin-top:10px}
.lbl{font-size:13px;color:var(--muted);min-width:64px}
.chip{border:1px solid var(--line);background:transparent;color:var(--ink);padding:6px 12px;border-radius:999px;font:inherit;font-size:14px;cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--card)}
.chip small{opacity:.7;margin-left:4px}
.tabs{display:flex;gap:4px;background:var(--line);padding:4px;border-radius:12px;margin-top:16px}
.tab{flex:1;border:0;background:transparent;color:var(--muted);padding:9px 6px;border-radius:9px;font:inherit;font-size:14px;font-weight:600;cursor:pointer}
.tab.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.meta{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);margin-bottom:10px;gap:8px;flex-wrap:wrap}
.bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin-bottom:14px}
.bar i{display:block;height:100%;background:var(--accent);transition:width .25s}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:6px;background:var(--accent-soft);color:var(--accent);margin-right:6px}
.tag.h{background:var(--hard-soft);color:var(--hard)}
.tag.x{background:var(--x-soft);color:var(--x)}
.q{font-size:19px;font-weight:600;margin:6px 0 16px;line-height:1.45}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;border:1.5px solid var(--line);background:var(--card);color:var(--ink);padding:12px 14px;border-radius:11px;font:inherit;cursor:pointer;transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .k{flex:none;width:26px;height:26px;border-radius:7px;background:var(--line);display:grid;place-items:center;font-weight:700;font-size:13px}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)} .opt.ok .k{background:var(--ok);color:var(--card)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)} .opt.bad .k{background:var(--bad);color:var(--card)}
.opt:disabled{cursor:default}
.exp{margin-top:14px;padding:12px 14px;border-radius:11px;background:var(--accent-soft);font-size:15px}
.exp b{display:block;margin-bottom:2px}
.actions{display:flex;gap:8px;justify-content:space-between;margin-top:16px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:10px 16px;border-radius:10px;font:inherit;font-weight:600;cursor:pointer}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--card)}
.btn.okb{background:var(--ok);border-color:var(--ok);color:var(--card)}
.btn.badb{background:var(--bad);border-color:var(--bad);color:var(--card)}
.btn:disabled{opacity:.45;cursor:default}
.hint{font-size:12px;color:var(--muted);margin-top:12px;text-align:center}
.flip{perspective:1400px;cursor:pointer}
.flip .in{position:relative;transition:transform .45s;transform-style:preserve-3d;min-height:300px}
.flip.on .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:1px solid var(--line);border-radius:14px;padding:22px;background:var(--card);display:flex;flex-direction:column;overflow:auto}
.face.back{transform:rotateY(180deg);background:var(--accent-soft)}
.face .lst{margin:6px 0 0;padding-left:0;list-style:none;color:var(--muted);font-size:15px}
.face .lst li{padding:3px 0}
.ans{font-size:19px;font-weight:700;color:var(--ok);margin:8px 0 12px}
.center{text-align:center;padding:30px 10px}
.big{font-size:44px;font-weight:700;margin:6px 0}
.list details{border-top:1px solid var(--line);padding:10px 0}
.list summary{cursor:pointer;font-weight:600;list-style:none}
.list summary::-webkit-details-marker{display:none}
.list .a{color:var(--ok);font-weight:600;margin-top:6px}
.list .e{color:var(--muted);font-size:14px}
.search{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;margin-bottom:8px}
.empty{color:var(--muted);text-align:center;padding:30px}
.small{font-size:13px;color:var(--muted)}
.fsum{cursor:pointer;list-style:none;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}.fsum::-webkit-details-marker{display:none}.fsum b::after{content:" ▾";color:var(--muted)}details[open] .fsum b::after{content:" ▴"}
.toggle{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted);cursor:pointer}
@media (max-width:560px){.hint{display:none}.opt{padding:14px 12px}header p{display:none}header h1{font-size:20px}.chip{padding:5px 10px;font-size:13px}.tabs{margin-top:12px}.q{font-size:17px}.tab{font-size:13px}.flip .in{min-height:360px}}
</style>
</head>

<div class="wrap">

  <p>Ngân hàng <b id="total"></b> câu trắc nghiệm (dễ & khó): <b id="nS"></b> câu bám sát slide và <b id="nX"></b> câu bổ sung kiến thức mở rộng (mô hình, kỹ thuật, độ đo liên quan ngoài slide). Bài 1 soạn theo đề cương vì dự án chưa có slide bài này.</p>

<script>
// Format: [bài, độ khó (E=dễ, H=khó), câu hỏi, đáp án đúng, [phương án sai], giải thích]
const Q_A = [
// ================= BÀI 1 – NLP và ứng dụng (theo đề cương + kiến thức nền) =================
["1","E","Xử lý ngôn ngữ tự nhiên (NLP) là lĩnh vực nghiên cứu điều gì?","Giúp máy tính hiểu, phân tích và sinh ngôn ngữ của con người","Thiết kế ngôn ngữ lập trình mới cho máy tính",["Nén dữ liệu văn bản để lưu trữ hiệu quả","Nhận dạng ảnh chữ viết tay bằng xử lý ảnh thuần túy"],"NLP là giao thoa giữa KHMT, AI và ngôn ngữ học, nhằm cho máy hiểu và sinh ngôn ngữ tự nhiên."],
["1","E","Ứng dụng nào sau đây KHÔNG thuộc nhóm ứng dụng NLP được nêu trong đề cương môn học?","Phát hiện vật thể trong ảnh","Kiểm tra lỗi chính tả",["Phát hiện đạo văn","Dịch máy"],"Đề cương liệt kê: kiểm tra chính tả, phát hiện đạo văn, phân tích cảm xúc, nhận dạng thực thể, phân lớp, tóm tắt, dịch máy, hỏi đáp. Phát hiện vật thể là bài toán thị giác máy tính."],
["1","E","Thư viện Python nào được đề cương nêu tên trong mục 'Một số thư viện và công cụ cho NLP'?","NLTK (Natural Language Toolkit)","OpenCV",["Pandas Profiling","Matplotlib"],"Mục 1.4.1 của đề cương: Thư viện NLTK (Natural Language Toolkit)."],
["1","E","Thứ tự hợp lý của quy trình xây dựng một ứng dụng NLP là gì?","Thu thập dữ liệu → Tiền xử lý → Trích chọn đặc trưng/biểu diễn → Huấn luyện mô hình → Đánh giá → Triển khai","Huấn luyện mô hình → Thu thập dữ liệu → Đánh giá → Tiền xử lý",["Tiền xử lý → Triển khai → Thu thập dữ liệu → Đánh giá","Đánh giá → Trích chọn đặc trưng → Thu thập dữ liệu → Huấn luyện"],"Pipeline điển hình: dữ liệu → làm sạch/tiền xử lý → biểu diễn → mô hình → đánh giá → triển khai (và lặp lại)."],
["1","E","Tách từ (tokenization) là gì?","Chia văn bản thành các đơn vị nhỏ hơn như từ hoặc subword","Gán nhãn từ loại cho mỗi từ",["Đưa từ về dạng gốc theo từ điển","Loại bỏ các từ dừng (stopwords)"],"Tokenization tách chuỗi ký tự thành token; là bước đầu của hầu hết pipeline NLP."],
["1","E","Stopwords là gì?","Những từ xuất hiện rất thường xuyên nhưng ít mang nghĩa phân biệt (the, a, là, của…)","Những từ không có trong từ điển (OOV)",["Những từ đánh dấu kết thúc câu","Những từ hiếm chỉ xuất hiện một lần"],"Stopwords thường được loại bỏ trong các mô hình dựa trên đếm như BoW/TF-IDF."],
["1","H","Điểm khác nhau chính giữa stemming và lemmatization là gì?","Stemming cắt hậu tố theo luật nên có thể ra từ không có thật; lemmatization dùng từ điển/từ loại để trả về dạng gốc hợp lệ","Stemming dùng từ điển, lemmatization chỉ cắt hậu tố",["Hai kỹ thuật cho kết quả luôn giống nhau","Lemmatization chỉ áp dụng cho tiếng Việt"],"Ví dụ: 'studies' → stem 'studi', lemma 'study'; 'better' → lemma 'good' (cần thông tin từ loại)."],
["1","H","Vì sao tách từ trong tiếng Việt khó hơn tiếng Anh?","Tiếng Việt là ngôn ngữ đơn lập, khoảng trắng tách âm tiết chứ không tách từ (ví dụ 'học sinh' là một từ gồm 2 âm tiết)","Tiếng Việt không dùng khoảng trắng",["Tiếng Việt không có dấu câu","Tiếng Việt có quá ít từ vựng"],"Ranh giới từ tiếng Việt không trùng khoảng trắng nên cần công cụ tách từ (VnCoreNLP, pyvi, underthesea…)."],
["1","E","Bài toán phân tích cảm xúc (sentiment analysis) thuộc loại bài toán nào?","Phân lớp văn bản","Sinh văn bản",["Gán nhãn chuỗi","Dịch máy"],"Mỗi văn bản được gán một nhãn cảm xúc (tích cực/tiêu cực/trung tính)."],
["1","E","Nhận dạng thực thể có tên (NER) thuộc loại bài toán nào?","Gán nhãn chuỗi (sequence labeling)","Phân cụm văn bản",["Hồi quy","Sinh tóm tắt"],"NER gán nhãn cho từng token (PER, LOC, ORG, O…), là bài toán gán nhãn chuỗi."],
["1","H","Bài toán dịch máy, tóm tắt văn bản sinh (abstractive) có đặc điểm chung nào về dạng đầu vào/đầu ra?","Đầu vào và đầu ra đều là chuỗi có độ dài thay đổi (sequence-to-sequence)","Đầu ra là một nhãn duy nhất",["Đầu ra có cùng độ dài với đầu vào","Đầu vào là ảnh, đầu ra là văn bản"],"Đây là nhóm bài toán seq2seq, thường giải bằng kiến trúc encoder–decoder (Bài 5, 6)."],
["1","E","Biểu thức chính quy (regular expression) thường dùng trong NLP để làm gì?","Tìm kiếm/trích xuất/làm sạch mẫu chuỗi như email, số điện thoại, thẻ HTML","Huấn luyện mô hình ngôn ngữ",["Tính độ tương tự cosine","Giảm chiều dữ liệu"],"Slide Bài 2 dùng regex để tiền xử lý dữ liệu web nhiễu và trích số, email."],
["1","H","Ngôn ngữ tự nhiên có tính nhập nhằng (ambiguity). Câu 'I saw the man with the telescope' minh họa loại nhập nhằng nào?","Nhập nhằng cấu trúc/cú pháp (gắn cụm giới từ)","Nhập nhằng chính tả",["Nhập nhằng âm vị","Không có nhập nhằng"],"'with the telescope' có thể bổ nghĩa cho 'saw' hoặc 'the man' → hai cây cú pháp khác nhau."],
["1","E","Đề cương xác định các học phần tiên quyết (học phần trước) của môn NLP là gì?","Học máy, Học sâu","Cấu trúc dữ liệu, Mạng máy tính",["Xác suất thống kê, Đại số tuyến tính","Thị giác máy tính"],"Mục I đề cương: Học phần trước: Học máy, Học sâu."],
["1","E","Theo đề cương, điểm học phần được tính như thế nào?","DHP = 0,1·A1 + 0,3·A2 + 0,6·A3","DHP = 0,2·A1 + 0,3·A2 + 0,5·A3",["DHP = 0,1·A1 + 0,4·A2 + 0,5·A3","DHP = 0,3·A1 + 0,3·A2 + 0,4·A3"],"A1 thường xuyên (10%), A2 quá trình – trắc nghiệm sau Bài 7 (30%), A3 thi kết thúc – trắc nghiệm, vấn đáp BTL (60%)."],
["1","H","Một hệ thống chatbot hỏi đáp dựa trên LLM + RAG cần những thành phần NLP nào?","Truy hồi văn bản liên quan (biểu diễn/embedding + tìm kiếm tương tự) và mô hình sinh câu trả lời","Chỉ cần bộ đếm từ BoW",["Chỉ cần bộ tách từ","Chỉ cần bộ gán nhãn từ loại"],"RAG = Retrieval (embedding, vector search) + Generation (LLM) — nội dung Bài 7–8, nhưng dựa trên biểu diễn từ/câu ở Bài 3, 6."],
["1","E","Corpus (kho ngữ liệu) là gì?","Tập hợp lớn các văn bản dùng để huấn luyện/đánh giá mô hình","Một mô hình ngôn ngữ đã huấn luyện",["Danh sách các stopwords","Một thuật toán phân lớp"],"Ví dụ: Enron Spam Corpus, Ling Spam Corpus (Bài 2), Wikipedia, BooksCorpus (BERT)."],

// ================= BÀI 2 – Trích chọn đặc trưng, Naive Bayes, lọc thư rác =================
["2","E","Lọc thư rác (spam filtering) là một dạng của bài toán nào?","Phân loại văn bản (spam vs ham)","Dịch máy",["Nhận dạng thực thể","Tóm tắt văn bản"],"Slide: lọc thư rác là một dạng của phân loại văn bản, phân email thành Spam hoặc Ham."],
["2","E","Trong bài toán lọc thư rác, 'ham' là gì?","Email bình thường (không phải rác)","Email quảng cáo",["Email chứa virus","Email bị trùng lặp"],"Ham = email bình thường, spam = email rác."],
["2","E","Hai kho ngữ liệu email được slide nêu cho bài toán lọc thư rác là gì?","Ling Spam Corpus và Enron Spam Corpus","Penn Treebank và WordNet",["SQuAD và GLUE","CoNLL 2003 và MNLI"],"Slide: kho ngữ liệu mail sử dụng: Ling Spam Corpus & Enron Spam Corpus."],
["2","H","Kho email Enron trong slide gồm bao nhiêu email và chia thành mấy thư mục?","33.716 email trong 6 thư mục","16.545 email trong 2 thư mục",["17.171 email trong 6 thư mục","80.000 email trong 10 thư mục"],"33.716 email, 6 thư mục; trong đó 16.545 spam và 17.171 ham."],
["2","H","Trong kho Enron, số email spam và ham tương ứng là bao nhiêu?","16.545 spam và 17.171 ham","17.171 spam và 16.545 ham",["10.000 spam và 23.716 ham","Mỗi loại 16.858"],"Slide: tổng số email rác và bình thường tương ứng là 16.545 và 17.171 (dữ liệu khá cân bằng)."],

const LESSONS=[["1","Bài 1 · NLP & ứng dụng"],["2","Bài 2 · Đặc trưng & NB"],["3","Bài 3 · Word embeddings"],["4","Bài 4 · RNN/LSTM"],["5","Bài 5 · Seq2Seq & Attention"],["6.1","Bài 6.1 · Transformer"],["6.2","Bài 6.2 · BERT"]];
const LNAME=Object.fromEntries(LESSONS);
const DB=[...[...Q_A,...Q_B,...Q_C].map(r=>[r,'S']),...[...QX_A,...QX_B,...QX_C].map(r=>[r,'X'])].map(([r,s],i)=>({id:s+'|'+r[2],src:s,l:r[0],lv:r[1],q:r[2],a:r[3],w:[r[4],...r[5]],e:r[6]}));
document.getElementById('total').textContent=DB.length;
document.getElementById('nS').textContent=DB.filter(q=>q.src==='S').length;
document.getElementById('nX').textContent=DB.filter(q=>q.src==='X').length;

const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let wrongSet=new Set(store.get('nlp_wrong2',[]));
let known=new Set(store.get('nlp_known2',[]));
const saveWrong=()=>{store.set('nlp_wrong2',[...wrongSet]);document.getElementById('wrongN').textContent=wrongSet.size?`(${wrongSet.size})`:''};
const saveKnown=()=>store.set('nlp_known2',[...known]);

let selL=new Set(LESSONS.map(x=>x[0])), selLv='all', selSrc='S', mode='quiz';
const shufEl=document.getElementById('shuf');
const stage=document.getElementById('stage');

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function pool(){return DB.filter(q=>selL.has(q.l)&&(selLv==='all'||q.lv===selLv)&&(selSrc==='all'||q.src===selSrc))}
function tags(q){return `<span class="tag">${LNAME[q.l].split(' · ')[0]}</span><span class="tag ${q.lv==='H'?'h':''}">${q.lv==='H'?'Khó':'Dễ'}</span>${q.src==='X'?'<span class="tag x">Mở rộng</span>':''}`}

// ---------- filters ----------
const lw=document.getElementById('lessons');
function drawLessons(){lw.innerHTML=`<button class="chip ${selL.size===LESSONS.length?'on':''}" data-l="all">Tất cả</button>`+LESSONS.map(([k,n])=>`<button class="chip ${selL.has(k)?'on':''}" data-l="${k}">${n.split(' · ')[0].replace('Bài ','')}<small>${DB.filter(q=>q.l===k&&(selSrc==='all'||q.src===selSrc)).length}</small></button>`).join('')}
drawLessons();
lw.onclick=e=>{const b=e.target.closest('[data-l]');if(!b)return;const k=b.dataset.l;
  if(k==='all'){selL=selL.size===LESSONS.length?new Set():new Set(LESSONS.map(x=>x[0]))}
  else{selL.has(k)?selL.delete(k):selL.add(k)}
  lw.querySelectorAll('[data-l]').forEach(c=>c.classList.toggle('on',c.dataset.l==='all'?selL.size===LESSONS.length:selL.has(c.dataset.l)));
  restart()};
document.querySelectorAll('[data-src]').forEach(b=>b.onclick=()=>{selSrc=b.dataset.src;document.querySelectorAll('[data-src]').forEach(c=>c.classList.toggle('on',c===b));drawLessons();restart()});
document.querySelectorAll('[data-lv]').forEach(b=>b.onclick=()=>{selLv=b.dataset.lv;document.querySelectorAll('[data-lv]').forEach(c=>c.classList.toggle('on',c===b));restart()});
shufEl.onchange=restart;
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{mode=t.dataset.m;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===t));restart()});
function info(){const p=pool();const ls=selL.size===LESSONS.length?'Tất cả bài':[...selL].sort().map(x=>'B'+x).join(', ')||'Chưa chọn bài';document.getElementById('fsumTxt').textContent=`${ls} · ${{all:'Mọi nguồn',S:'Theo slide',X:'Bổ sung'}[selSrc]} · ${{all:'Dễ+Khó',E:'Dễ',H:'Khó'}[selLv]} · ${p.length} câu`;document.getElementById('selInfo').textContent=`Đang chọn ${p.length} câu (${p.filter(q=>q.src==='S').length} theo slide, ${p.filter(q=>q.src==='X').length} bổ sung) · ${p.filter(q=>q.lv==='E').length} dễ, ${p.filter(q=>q.lv==='H').length} khó · đã thuộc (flashcard) ${p.filter(q=>known.has(q.id)).length}`}

// ---------- quiz ----------
let S={};
function startQuiz(list,label){
  S={list:shufEl.checked?shuffle(list):list,i:0,score:0,answered:0,wrongNow:[],label,picked:null,opts:[]};
  renderQ();
}
function renderQ(){
  const {list,i}=S;
  if(!list.length){stage.innerHTML=`<div class="empty">${mode==='wrong'?'Chưa có câu sai nào trong phạm vi đã chọn. Làm Quiz trước, các câu trả lời sai sẽ được lưu ở đây.':'Không có câu nào. Hãy chọn ít nhất một bài.'}</div>`;return}
  if(i>=list.length)return renderEnd();
  const q=list[i];
  S.opts=shuffle([q.a,...q.w]);S.picked=null;
  stage.innerHTML=`
  <div class="meta"><span>${S.label} · Câu ${i+1}/${list.length}</span><span>Đúng ${S.score}/${S.answered}</span></div>
  <div class="bar"><i style="width:${i/list.length*100}%"></i></div>
  <div>${tags(q)}</div>
  <div class="q">${esc(q.q)}</div>
  <div class="opts">${S.opts.map((o,k)=>`<button class="opt" data-k="${k}"><span class="k">${'ABCD'[k]}</span><span>${esc(o)}</span></button>`).join('')}</div>
  <div id="expBox"></div>
  <div class="actions"><span></span><button class="btn pri" id="nextB">Bỏ qua →</button></div>
  <div class="hint">Phím tắt: 1–4 hoặc A–D để chọn · Enter / → sang câu tiếp</div>`;
  stage.querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(+b.dataset.k));
  document.getElementById('nextB').onclick=next;
}
function pick(k){
  if(S.picked!==null)return;
  const q=S.list[S.i];S.picked=k;S.answered++;
  const right=S.opts[k]===q.a;
  stage.querySelectorAll('.opt').forEach((b,j)=>{b.disabled=true;if(S.opts[j]===q.a)b.classList.add('ok');else if(j===k)b.classList.add('bad')});
  if(right){S.score++;if(mode==='wrong'){wrongSet.delete(q.id)}}
  else{wrongSet.add(q.id);S.wrongNow.push(q)}
  saveWrong();
  document.getElementById('expBox').innerHTML=`<div class="exp"><b>${right?'✓ Chính xác':'✗ Chưa đúng'} — Đáp án: ${esc(q.a)}</b>${esc(q.e)}</div>`;
  const nb=document.getElementById('nextB');nb.textContent=S.i+1<S.list.length?'Câu tiếp →':'Xem kết quả →';
  stage.querySelector('.meta span:last-child').textContent=`Đúng ${S.score}/${S.answered}`;
}
function next(){S.i++;renderQ()}
function renderEnd(){
  const pct=S.answered?Math.round(S.score/S.answered*100):0;
  const byL={};S.list.forEach(q=>{byL[q.l]=byL[q.l]||[0,0];byL[q.l][1]++});S.wrongNow.forEach(q=>byL[q.l][0]++);
  stage.innerHTML=`<div class="center">
   <div class="small">${S.label} – hoàn thành</div>
   <div class="big">${S.score}/${S.answered}</div>
   <div>${pct}% câu đã trả lời là đúng${S.answered<S.list.length?` · bỏ qua ${S.list.length-S.answered} câu`:''}</div>
   <div class="small" style="margin-top:14px">${Object.entries(byL).map(([l,[w,t]])=>`${LNAME[l].split(' · ')[0]}: sai ${w}/${t}`).join(' · ')}</div>
   <div class="actions" style="justify-content:center;margin-top:20px">
     ${S.wrongNow.length?`<button class="btn badb" id="redoW">Làm lại ${S.wrongNow.length} câu sai</button>`:''}
     <button class="btn pri" id="again">Làm lại từ đầu</button></div></div>`;
  const r=document.getElementById('redoW');if(r)r.onclick=()=>startQuiz(S.wrongNow,'Làm lại câu sai');
  document.getElementById('again').onclick=restart;
}

// ---------- flashcards ----------
let F={};
function startFlash(){
  const p=pool();const rest=p.filter(q=>!known.has(q.id));
  F={deck:shufEl.checked?shuffle(rest):rest,total:p.length,flipped:false};
  renderF();
}
function renderF(){
  const p=pool();
  if(!p.length){stage.innerHTML=`<div class="empty">Không có câu nào. Hãy chọn ít nhất một bài.</div>`;return}
  if(!F.deck.length){stage.innerHTML=`<div class="center"><div class="big">🎉</div><div>Bạn đã đánh dấu thuộc toàn bộ ${p.length} thẻ trong phạm vi này.</div><div class="actions" style="justify-content:center;margin-top:18px"><button class="btn pri" id="resetK">Đặt lại & học lại</button></div></div>`;
    document.getElementById('resetK').onclick=()=>{p.forEach(q=>known.delete(q.id));saveKnown();startFlash();info()};return}
  const q=F.deck[0];const done=F.total-F.deck.length;
  const others=shuffle([q.a,...q.w]);
  stage.innerHTML=`
  <div class="meta"><span>Còn ${F.deck.length} thẻ · đã thuộc ${done}/${F.total}</span><span>${tags(q)}</span></div>
  <div class="bar"><i style="width:${done/F.total*100}%"></i></div>
  <div class="flip" id="card"><div class="in">
    <div class="face"><div class="small">Câu hỏi – hãy tự nhớ đáp án rồi lật thẻ</div><div class="q" style="margin-top:8px">${esc(q.q)}</div>
      <ul class="lst">${others.map((o,k)=>`<li>${'ABCD'[k]}. ${esc(o)}</li>`).join('')}</ul></div>
    <div class="face back"><div class="small">Đáp án</div><div class="ans">${esc(q.a)}</div><div>${esc(q.e)}</div></div>
  </div></div>
  <div class="actions"><button class="btn badb" id="no">✗ Chưa thuộc</button><button class="btn" id="fl">Lật thẻ</button><button class="btn okb" id="yes">✓ Đã thuộc</button></div>
  <div class="hint">Space / click để lật · ← chưa thuộc (thẻ quay lại cuối bộ) · → đã thuộc</div>`;
  F.flipped=false;
  const card=document.getElementById('card');
  card.onclick=flip;document.getElementById('fl').onclick=flip;
  document.getElementById('yes').onclick=()=>fAns(true);document.getElementById('no').onclick=()=>fAns(false);
}
function flip(){F.flipped=!F.flipped;document.getElementById('card').classList.toggle('on',F.flipped)}
function fAns(ok){const q=F.deck.shift();if(ok){known.add(q.id);saveKnown()}else{F.deck.push(q);wrongSet.add(q.id);saveWrong()}renderF();info()}

// ---------- list ----------
function renderList(){
  const p=pool();
  stage.innerHTML=`<input class="search" id="sq" placeholder="Tìm trong câu hỏi, đáp án, giải thích…"><div class="list" id="lst"></div>`;
  const draw=t=>{t=t.toLowerCase();const f=p.filter(q=>!t||(q.q+q.a+q.e).toLowerCase().includes(t));
    document.getElementById('lst').innerHTML=f.length?LESSONS.filter(([k])=>f.some(q=>q.l===k)).map(([k,n])=>`<h3 style="margin:18px 0 4px;font-size:16px">${n}</h3>`+f.filter(q=>q.l===k).map(q=>`<details><summary>${q.lv==='H'?'<span class="tag h">Khó</span>':''}${q.src==='X'?'<span class="tag x">Mở rộng</span>':''}${esc(q.q)}</summary><div class="a">→ ${esc(q.a)}</div><div class="e">${esc(q.e)}</div></details>`).join('')).join(''):'<div class="empty">Không tìm thấy.</div>'};
  draw('');document.getElementById('sq').oninput=e=>draw(e.target.value);
}

// ---------- routing ----------
function restart(){info();
  if(mode==='quiz')startQuiz(pool(),'Quiz');
  else if(mode==='wrong')startQuiz(pool().filter(q=>wrongSet.has(q.id)),'Ôn câu sai');
  else if(mode==='flash')startFlash();
  else renderList();
}
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;
  if(mode==='quiz'||mode==='wrong'){
    if(!S.list||S.i>=S.list.length)return;
    const m={'1':0,'2':1,'3':2,'4':3,a:0,b:1,c:2,d:3}[e.key.toLowerCase()];
    if(m!==undefined&&S.picked===null){pick(m);e.preventDefault()}
    else if(e.key==='Enter'||e.key==='ArrowRight'){next();e.preventDefault()}
  } else if(mode==='flash'&&F.deck&&F.deck.length){
    if(e.key===' '){flip();e.preventDefault()}
    else if(e.key==='ArrowRight')fAns(true);
    else if(e.key==='ArrowLeft')fAns(false);
  }
});
if(window.innerWidth<600)document.getElementById('filt').removeAttribute('open');
saveWrong();restart();
</script>

try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
</script>
